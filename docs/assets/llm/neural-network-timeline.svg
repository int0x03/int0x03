<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Timeline of major neural network architecture milestones</title>
  <desc id="desc">A timeline from the 1958 perceptron through convolutional, recurrent, autoencoder, mixture of experts, Siamese, graph, adversarial, diffusion, and Transformer milestones up to 2020.</desc>
  <defs>
    <style>
      .axis{stroke:#64748b;stroke-width:4}.tick{stroke:#64748b;stroke-width:2}.stem{stroke:#94a3b8;stroke-width:2}
      .dot{fill:#2563eb;stroke:#fff;stroke-width:3}.late{fill:#7c3aed}.label{font:600 18px system-ui,sans-serif;fill:#172033}
      .date{font:700 16px system-ui,sans-serif;fill:#2563eb}.note{font:14px system-ui,sans-serif;fill:#475569}
      .era{font:600 15px system-ui,sans-serif;fill:#64748b}.panel{fill:#f8fafc;stroke:#dbe3ee;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#64748b"/></marker>
  </defs>
  <rect class="panel" x="10" y="10" width="1080" height="370" rx="18"/>
  <text class="label" x="40" y="45">Architecture milestones</text>
  <text class="note" x="40" y="70">Dates identify influential publications; each idea evolved over many years.</text>
  <line class="axis" x1="65" y1="220" x2="1040" y2="220" marker-end="url(#arrow)"/>

  <g transform="translate(95)"><line class="stem" y1="220" y2="125"/><circle class="dot" cy="220" r="9"/><text class="date" text-anchor="middle" y="110">1958</text><text class="label" text-anchor="middle" y="88">Perceptron</text><text class="note" text-anchor="middle" y="246">learn a boundary</text></g>
  <g transform="translate(245)"><line class="stem" y1="220" y2="285"/><circle class="dot" cy="220" r="9"/><text class="date" text-anchor="middle" y="310">1980s</text><text class="label" text-anchor="middle" y="335">Convolution · recurrence</text><text class="note" text-anchor="middle" y="357">space, order, representation</text></g>
  <g transform="translate(390)"><line class="stem" y1="220" y2="125"/><circle class="dot" cy="220" r="9"/><text class="date" text-anchor="middle" y="110">1991–1997</text><text class="label" text-anchor="middle" y="88">Experts · similarity · memory</text><text class="note" text-anchor="middle" y="246">specialize, compare, remember</text></g>
  <g transform="translate(540)"><line class="stem" y1="220" y2="285"/><circle class="dot" cy="220" r="9"/><text class="date" text-anchor="middle" y="310">2005–2009</text><text class="label" text-anchor="middle" y="335">Graph networks</text><text class="note" text-anchor="middle" y="357">follow graph links</text></g>
  <g transform="translate(690)"><line class="stem" y1="220" y2="125"/><circle class="dot late" cy="220" r="9"/><text class="date" text-anchor="middle" y="110">2013–2015</text><text class="label" text-anchor="middle" y="88">New generative models</text><text class="note" text-anchor="middle" y="246">sample, compete, denoise</text></g>
  <g transform="translate(845)"><line class="stem" y1="220" y2="285"/><circle class="dot late" cy="220" r="9"/><text class="date" text-anchor="middle" y="310">2017</text><text class="label" text-anchor="middle" y="335">Transformer</text><text class="note" text-anchor="middle" y="357">attend directly</text></g>
  <g transform="translate(990)"><line class="stem" y1="220" y2="125"/><circle class="dot late" cy="220" r="9"/><text class="date" text-anchor="middle" y="110">2020</text><text class="label" text-anchor="middle" y="88">Vision · diffusion</text><text class="note" text-anchor="middle" y="246">modern vision and generation</text></g>

  <text class="era" x="65" y="195">connection patterns</text>
  <text class="era" x="735" y="195">foundation-model era</text>
</svg>


