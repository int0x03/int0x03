<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of autoencoder, generative adversarial network, and diffusion workflows</title>
  <desc id="desc">Three horizontal diagrams show reconstruction through a bottleneck, competition between a generator and discriminator, and repeated denoising from noise into a sample.</desc>
  <defs>
    <style>
      .panel{fill:#f8fafc;stroke:#dbe3ee;stroke-width:2}.heading{font:700 19px system-ui,sans-serif;fill:#172033}.copy{font:14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#2563eb;stroke-width:2}.special{fill:#ede9fe;stroke:#7c3aed;stroke-width:2}.edge{stroke:#64748b;stroke-width:2;fill:none}.feedback{stroke:#dc2626;stroke-width:2;fill:none;stroke-dasharray:6 5}.good{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#64748b"/></marker>
    <marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3z" fill="#dc2626"/></marker>
  </defs>
  <rect class="panel" x="15" y="15" width="970" height="140" rx="16"/><text class="heading" x="40" y="48">Autoencoder · learn by reconstruction</text>
  <g transform="translate(65 73)"><rect class="box" width="130" height="48" rx="9"/><text class="copy" x="65" y="30" text-anchor="middle">input</text><path class="edge" d="M130 24H205" marker-end="url(#arrow)"/><rect class="box" x="215" width="130" height="48" rx="9"/><text class="copy" x="280" y="30" text-anchor="middle">encoder</text><path class="edge" d="M345 24H420" marker-end="url(#arrow)"/><rect class="special" x="430" y="7" width="90" height="34" rx="17"/><text class="copy" x="475" y="29" text-anchor="middle">code</text><path class="edge" d="M520 24H595" marker-end="url(#arrow)"/><rect class="box" x="605" width="130" height="48" rx="9"/><text class="copy" x="670" y="30" text-anchor="middle">decoder</text><path class="edge" d="M735 24H790" marker-end="url(#arrow)"/><rect class="good" x="800" width="110" height="48" rx="9"/><text class="copy" x="855" y="30" text-anchor="middle">rebuild</text></g>

  <rect class="panel" x="15" y="180" width="970" height="140" rx="16"/><text class="heading" x="40" y="213">Generative adversarial network · learn through competition</text>
  <g transform="translate(65 238)"><rect class="box" width="120" height="48" rx="9"/><text class="copy" x="60" y="30" text-anchor="middle">random seed</text><path class="edge" d="M120 24H190" marker-end="url(#arrow)"/><rect class="special" x="200" width="140" height="48" rx="9"/><text class="copy" x="270" y="30" text-anchor="middle">generator</text><path class="edge" d="M340 24H410" marker-end="url(#arrow)"/><rect class="box" x="420" width="150" height="48" rx="9"/><text class="copy" x="495" y="30" text-anchor="middle">synthetic sample</text><path class="edge" d="M570 24H640" marker-end="url(#arrow)"/><rect class="special" x="650" width="150" height="48" rx="9"/><text class="copy" x="725" y="30" text-anchor="middle">discriminator</text><path class="feedback" d="M725 48C725 95 270 95 270 50" marker-end="url(#red)"/><text class="copy" x="495" y="91" text-anchor="middle">feedback improves the generator</text></g>

  <rect class="panel" x="15" y="345" width="970" height="140" rx="16"/><text class="heading" x="40" y="378">Diffusion · learn by reversing gradual noise</text>
  <g transform="translate(65 403)"><rect class="special" width="125" height="48" rx="9"/><text class="copy" x="62" y="30" text-anchor="middle">random noise</text><path class="edge" d="M125 24H200" marker-end="url(#arrow)"/><rect class="box" x="210" width="140" height="48" rx="9"/><text class="copy" x="280" y="30" text-anchor="middle">denoise</text><path class="edge" d="M350 24H425" marker-end="url(#arrow)"/><rect class="box" x="435" width="140" height="48" rx="9"/><text class="copy" x="505" y="30" text-anchor="middle">denoise again</text><path class="edge" d="M575 24H650" marker-end="url(#arrow)"/><text class="heading" x="618" y="29">…</text><path class="edge" d="M665 24H740" marker-end="url(#arrow)"/><rect class="good" x="750" width="145" height="48" rx="9"/><text class="copy" x="822" y="30" text-anchor="middle">new sample</text></g>
</svg>

